services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webrtc-stream-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Go2Rtc__BaseUrl=${GO2RTC_BASE_URL}
      - Go2Rtc__DefaultStream=${GO2RTC_DefaultStream:-}
      - Cloudflare__TurnKeyId=${CLOUDFLARE_TURN_KEY_ID:-}
      - Cloudflare__ApiToken=${CLOUDFLARE_API_TOKEN:-}
      - Cloudflare__TtlSeconds=${CLOUDFLARE_TTL_SECONDS:-3600}
      - Cloudflare__Enabled=${CLOUDFLARE_ENABLED:-true}
    depends_on:
      - go2rtc

  go2rtc:
    image: alexxit/go2rtc:master-hardware
    container_name: go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
